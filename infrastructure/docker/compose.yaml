# Local stack: warehouse Postgres, Airflow 3.4.0 (LocalExecutor), a SeaweedFS
# S3-compatible object store, and an OpenTelemetry Collector. Run it through
# the Makefile (`make env`, then `make up`), which passes the root .env file.
#
# The Airflow services are adapted from the official 3.4.0 docker-compose.yaml
# (https://airflow.apache.org/docs/apache-airflow/3.4.0/docker-compose.yaml):
# LocalExecutor instead of Celery (so no Redis, worker or Flower), no example
# DAGs, secrets from .env instead of defaults, and ports bound to 127.0.0.1.
# The triggerer is left out until a deferrable task needs it.
name: northstar

x-airflow-common: &airflow-common
  # apache/airflow:3.4.0-python3.13 plus the project in /opt/northstar/.venv
  # (airflow/Dockerfile). `make up` passes the code version as a build arg.
  image: northstar-airflow:local
  build:
    context: ../..
    dockerfile: infrastructure/docker/airflow/Dockerfile
    args:
      # Empty outside make: the Dockerfile then refuses to build, but other
      # compose commands (ps, exec, logs) still work.
      NBI_CODE_VERSION: ${NBI_CODE_VERSION:-}
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__DEFAULT_TIMEZONE: utc
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?run make env}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?run make env}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://airflow:${AIRFLOW_DB_PASSWORD:?run make env}@airflow-db/airflow
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # Airflow task lineage (OpenLineage provider 2.21.0) as JSON Lines on the
    # airflow-lineage volume; dbt's lineage goes to the object store (ADR 008).
    AIRFLOW__OPENLINEAGE__NAMESPACE: northstar
    AIRFLOW__OPENLINEAGE__TRANSPORT: '{"type": "file", "log_file_path": "/opt/airflow/lineage/airflow.jsonl", "append": true}'
    # What the northstar CLI in the tasks needs, with in-network addresses.
    NBI_PG_HOST: warehouse-db
    NBI_PG_PORT: "5432"
    NBI_PG_DATABASE: ${NBI_PG_DATABASE:?run make env}
    NBI_PG_USER: ${NBI_PG_USER:?run make env}
    NBI_PG_PASSWORD: ${NBI_PG_PASSWORD:?run make env}
    NBI_S3_ENDPOINT_URL: http://object-store:8333
    NBI_S3_ACCESS_KEY_ID: ${NBI_S3_ACCESS_KEY_ID:?run make env}
    NBI_S3_SECRET_ACCESS_KEY: ${NBI_S3_SECRET_ACCESS_KEY:?run make env}
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    NBI_AIRFLOW_RETRIES: ${NBI_AIRFLOW_RETRIES:-2}
    NBI_AIRFLOW_RETRY_DELAY_SECONDS: ${NBI_AIRFLOW_RETRY_DELAY_SECONDS:-300}
  volumes:
    - airflow-logs:/opt/airflow/logs
    - airflow-lineage:/opt/airflow/lineage
    - ../../orchestration/airflow/dags:/opt/airflow/dags:ro
    - ../../data/generated:/opt/northstar/data/generated:ro
  user: "${AIRFLOW_UID:-50000}:0"
  restart: unless-stopped
  depends_on: &airflow-common-depends-on
    airflow-db:
      condition: service_healthy
    airflow-init:
      condition: service_completed_successfully

services:
  warehouse-db:
    image: postgres:18.7
    environment:
      POSTGRES_USER: ${NBI_PG_USER:?run make env}
      POSTGRES_PASSWORD: ${NBI_PG_PASSWORD:?run make env}
      POSTGRES_DB: ${NBI_PG_DATABASE:?run make env}
    ports:
      - "127.0.0.1:${NBI_PG_PORT:-5432}:5432"
    volumes:
      - warehouse-db-data:/var/lib/postgresql # PostgreSQL 18 images keep PGDATA under this path
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  object-store:
    image: chrislusf/seaweedfs:4.54
    # mini runs master, volume, filer and S3 in one process. The AWS_* variables
    # create the only S3 identity; anonymous and unknown keys are refused.
    command: mini -dir=/data -bucket=northstar-data-local -master.telemetry=false
    environment:
      AWS_ACCESS_KEY_ID: ${NBI_S3_ACCESS_KEY_ID:?run make env}
      AWS_SECRET_ACCESS_KEY: ${NBI_S3_SECRET_ACCESS_KEY:?run make env}
    ports:
      - "127.0.0.1:${NBI_S3_PORT:-8333}:8333"
    volumes:
      - object-store-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    # Receives OTLP over HTTP and prints it (debug exporter, ADR 008). The
    # image has no shell, so there is no in-container healthcheck: `make up`
    # waits for it to be running, and the health_check extension answers on
    # 127.0.0.1:13133 (CI checks it).
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:${OTEL_COLLECTOR_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:${OTEL_COLLECTOR_HEALTH_PORT:-13133}:13133"
    restart: unless-stopped

  airflow-db:
    image: postgres:18.7
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?run make env}
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow", "-d", "airflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    # Runs once: gives the airflow user the shared log volume, migrates the
    # metadata database and creates the admin user, then exits.
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/logs /opt/airflow/lineage && exec /entrypoint airflow version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USERNAME:?run make env}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?run make env}
    restart: "no"
    depends_on:
      airflow-db:
        condition: service_healthy

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:${AIRFLOW_UI_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    # LocalExecutor runs the pipeline's tasks (dbt included) in this container,
    # so a CLI healthcheck (`airflow jobs check`) can outlast its timeout and
    # pile up. The scheduler's own health server (enable_health_check above,
    # default port 8974) answers with a plain HTTP request instead.
    healthcheck:
      test: ["CMD", "curl", "--fail", "--max-time", "5", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  warehouse-db-data:
  airflow-db-data:
  airflow-logs:
  airflow-lineage:
  object-store-data:
