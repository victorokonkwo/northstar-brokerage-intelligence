# Local OpenTelemetry Collector (ADR 008; owner decision 2026-11-19: the
# Collector only, with the debug exporter, so telemetry appears in
# `docker compose logs otel-collector`). The same Collector pattern is used to
# export to CloudWatch over OTLP in AWS later. Listeners bind 0.0.0.0 inside
# the container; compose publishes them on 127.0.0.1 only.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  batch: {}

exporters:
  debug:
    verbosity: normal

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
