# Continuous integration: runs on every pull request and every push to main.
# Third-party actions are pinned to full commit SHAs (tag in the comment).
# Secret scanning of pull requests is done by the GitGuardian GitHub app.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.7"
  UV_LOCKED: "1" # every uv command fails instead of changing uv.lock
  HYPOTHESIS_PROFILE: ci # derandomized property tests (CONTRIBUTING.md W4)

jobs:
  checks:
    name: Lint, types, tests, dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install the locked environment
        run: uv sync

      - name: Lint, import contracts, mypy, tests
        run: make check

      - name: Repository hygiene hooks
        # The Python tools already ran in `make check`. no-commit-to-branch
        # would fail on pushes to main, where merges legitimately land.
        env:
          SKIP: no-commit-to-branch,ruff-check,ruff-format,mypy,import-linter
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Audit locked dependencies for known vulnerabilities (OSV)
        run: uv audit --preview-features audit-command

  terraform:
    name: Terraform format and validate (no AWS access)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false

      - name: Format check and validate every stack
        run: make tf-validate

  stack:
    name: Local stack from a fresh checkout
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # One quick retry, so the forced-failure check below finishes fast.
      NBI_AIRFLOW_RETRIES: "1"
      NBI_AIRFLOW_RETRY_DELAY_SECONDS: "5"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Generate .env and mask its secrets
        run: |
          make env
          grep -E '^[A-Z_]*(PASSWORD|SECRET|KEY)[A-Z_]*=' .env | cut -d= -f2- |
            while read -r value; do echo "::add-mask::${value}"; done

      - name: Start the stack and wait until every service is healthy
        run: make up

      - name: Integration tests against the warehouse
        run: make test-integration

      - name: dbt connects and parses, and SQLFluff lints the SQL
        # SQLFluff's dbt templater needs a live connection, so it runs here.
        run: |
          (set -a && . ./.env && set +a && cd warehouse/dbt && uv run dbt debug)
          make dbt-parse
          make sql-lint

      - name: Sprint 1 slice end to end, twice, with identical results
        # Phase 1 gate: a fresh clone runs a sample pipeline and reproduces the
        # same result. The second run must load nothing new and leave the
        # events file and the stored journal byte-for-byte identical.
        run: |
          make e2e
          set -a && . ./.env && set +a
          first_events=$(sha256sum data/generated/sprint1-cad-buy/seed=42/events.jsonl)
          first_journal=$(uv run northstar ledger-fingerprint)
          make e2e | tee second-run.txt
          grep -q "0 new events, 0 new journal lines" second-run.txt
          test "$first_events" = "$(sha256sum data/generated/sprint1-cad-buy/seed=42/events.jsonl)"
          test "$first_journal" = "$(uv run northstar ledger-fingerprint)"
          echo "reproduced: $first_events / $first_journal"

      - name: Generated dataset is repeatable, ingests idempotently, and balances in the warehouse
        # Two simulations must produce byte-identical canonical, external, and
        # defect files. Ingesting, loading, and building dbt must pass KPI-01.
        # Replaying the ingestion must write no raw objects, and loading the
        # replayed run must insert nothing (FR-M1-03).
        run: |
          make simulate | grep ' sha256 ' > first.txt
          make simulate | grep ' sha256 ' > second.txt
          diff first.txt second.txt
          test "$(wc -l < first.txt)" -eq 9
          make simulate-load RUN_ID=ci-first
          make ingest RUN_ID=ci-replay | tee replay-ingest.txt
          grep -q "(0 new)" replay-ingest.txt
          set -a && . ./.env && set +a
          uv run northstar load-run --run-id ci-replay --raw-schema raw_dev --ledger-schema ledger_dev \
            | tee replay.txt
          grep -q "0 new events, 0 new journal lines, 0 new external records" replay.txt
          echo "dataset reproduced: $(head -1 first.txt)"

      - name: Reconciliation finds exactly the injected defects (NFR-03), and a rerun adds nothing
        # The seven reconciliations over the loaded dev dataset must yield
        # exactly the defect manifest: every defect detected and classified,
        # with the same impact, and no exception beyond it. make reconcile
        # then rebuilds the controls marts, whose tests tie them out.
        run: |
          make reconcile | tee reconcile-1.txt
          grep -q "exact match" reconcile-1.txt
          make reconcile | tee reconcile-2.txt
          grep -q "matches (0 new), [0-9]* exceptions (0 new)" reconcile-2.txt
          grep -q "lifecycle: 0 opened, 0 source-corrected, 0 auto-resolved, 0 escalated" reconcile-2.txt

      - name: The publication gate holds blocked dates and releases them once resolved (FR-M2-08)
        # The controls snapshot always publishes. The financial snapshot of a
        # date with an open CRITICAL/HIGH exception stays DRAFT (exit 2). A
        # reasoned override of 2026-03-02's blocking exception then lets that
        # same version publish. Republishing creates no new version (INV-09).
        run: |
          set -a && . ./.env && set +a
          uv run northstar publish --stream controls --dbt-schema dbt_dataset \
            --published-schema published_controls_dev | tee controls-1.txt
          grep -Eq "; published [0-9]+$" controls-1.txt
          status=0
          uv run northstar publish --stream financial --dbt-schema dbt_dataset \
            --published-schema published_dev --recon-schema recon_dev > financial-1.txt || status=$?
          cat financial-1.txt
          test "$status" -eq 2
          grep -q "2026-03-02 v1 BLOCKED .* blocked by" financial-1.txt
          for id in $(uv run northstar exception list --recon-schema recon_dev --business-date 2026-03-02 \
                      | awk '$5 != "RESOLVED" && ($4 == "CRITICAL" || $4 == "HIGH") {print $1}'); do
            uv run northstar exception transition --recon-schema recon_dev --exception-id "$id" \
              --to RESOLVED --resolution MANUAL_OVERRIDE --actor user:ci \
              --reason "CI: synthetic defect acknowledged to exercise the gate"
          done
          uv run northstar publish --stream financial --dbt-schema dbt_dataset \
            --published-schema published_dev --recon-schema recon_dev \
            --business-date 2026-03-02 | tee financial-2.txt
          grep -q "2026-03-02 v1 PUBLISHED" financial-2.txt
          status=0
          uv run northstar publish --stream financial --dbt-schema dbt_dataset \
            --published-schema published_dev --recon-schema recon_dev > financial-3.txt || status=$?
          test "$status" -eq 2
          grep -q "unchanged" financial-3.txt
          ! grep -q "2026-03-02 .* BLOCKED" financial-3.txt

      - name: A late record restates published history (ADR 006, FR-M1-06)
        # A late deposit for 2026-03-02 arrives with its bank line after
        # publication. Ingest, load, dbt, reconcile, and publish again: it
        # reconciles cleanly, and 2026-03-02 is restated as v2 with a reason
        # while v1 stays queryable as SUPERSEDED.
        run: |
          set -a && . ./.env && set +a
          uv run northstar ingest --dataset-dir tests/fixtures/late_deposit --run-id ci-late
          uv run northstar load-run --run-id ci-late --raw-schema raw_dev --ledger-schema ledger_dev \
            --recon-schema recon_dev
          make dbt-build-dataset
          uv run northstar reconcile --dbt-schema dbt_dataset --recon-schema recon_dev | tee recon-late.txt
          grep -q "lifecycle: 0 opened" recon-late.txt
          status=0
          uv run northstar publish --stream financial --dbt-schema dbt_dataset \
            --published-schema published_dev --recon-schema recon_dev > publish-late.txt || status=$?
          cat publish-late.txt
          grep -q "2026-03-02 v2 PUBLISHED .* restates v1: mart_daily_client_cash changed" publish-late.txt
          uv run northstar snapshot-history --published-schema published_dev \
            --business-date 2026-03-02 | tee history.txt
          grep -q "v1 SUPERSEDED" history.txt
          grep -q "v2 PUBLISHED" history.txt

      - name: Incremental builds equal a full refresh (4F-b)
        # dbt_dataset has been built incrementally since the first load, last
        # with the late deposit above. A full-refresh build of the same data
        # must match it, model for model and row for row (the comparison exits
        # 1 on any difference).
        run: |
          make dbt-build-full
          make compare-incremental

      - name: The operations dashboard's data equals the published snapshots and the marts (FR-M2-09)
        # The serving views (ADR 011) show each date's currently published
        # controls snapshot; every row must equal that snapshot and the dbt
        # mart. The late deposit above changed two controls marts (cash breaks,
        # exception monitoring), so the controls stream is republished first.
        run: |
          set -a && . ./.env && set +a
          uv run northstar publish --stream controls --dbt-schema dbt_dataset \
            --published-schema published_controls_dev
          make serving
          make dashboard-check

      - name: Airflow runs the daily close, backfills, retries, alerts, and records lineage (FR-M1-07)
        # A daily run (business date 2026-01-06) and a backfill (2026-01-09, a
        # Friday, and 2026-01-10, a Saturday that must be skipped) publish into
        # their own schemas; every published date must equal the CLI
        # publication above. A run pointed at a missing dataset must fail after
        # its retry and leave an alert. dbt lineage must be archived.
        run: |
          af() { docker compose --env-file .env --file infrastructure/docker/compose.yaml \
                   exec -T airflow-scheduler airflow "$@" 2>/dev/null; }
          wait_runs() {
            for _ in $(seq 1 60); do
              af dags list-runs northstar_daily -o json > runs.json || true
              if python3 -c "import json,sys; r=json.load(open('runs.json')); \
                  sys.exit(0 if len(r) >= $1 and all(x['state'] in ('success','failed') for x in r) else 1)"; then
                return 0
              fi
              sleep 30
            done
            return 1
          }
          af dags list-import-errors | tee import-errors.txt
          grep -q "No data found" import-errors.txt
          test "$(af tasks list northstar_daily | tr '\n' ' ')" = "check_business_day dbt_build dbt_controls ingest load publish publish_controls reconcile "
          af dags unpause northstar_daily
          af dags trigger northstar_daily --logical-date 2026-01-07T11:00:00+00:00 \
            --run-id ci-daily --conf '{"published_schema": "published_af_daily", "controls_schema": "published_af_daily_controls", "recon_schema": "recon_af"}'
          af backfill create --dag-id northstar_daily --from-date 2026-01-10 \
            --to-date 2026-01-11T12:00:00+00:00 --max-active-runs 1 \
            --dag-run-conf '{"published_schema": "published_af_backfill", "controls_schema": "published_af_backfill_controls", "recon_schema": "recon_af"}'
          af dags trigger northstar_daily --logical-date 2026-01-13T11:00:00+00:00 \
            --run-id ci-fails --conf '{"dataset_dir": "/opt/northstar/data/generated/missing"}'
          wait_runs 4
          python3 -c "import json; print({x['run_id']: x['state'] for x in json.load(open('runs.json'))})"
          python3 -c "import json,sys; s={x['run_id']: x['state'] for x in json.load(open('runs.json'))}; \
            sys.exit(0 if s.pop('ci-fails') == 'failed' and set(s.values()) == {'success'} else 1)"
          af tasks states-for-dag-run northstar_daily "backfill__2026-01-11T11:00:00+00:00" -o json \
            | python3 -c "import json,sys; sys.exit(0 if {t['state'] for t in json.load(sys.stdin)} == {'skipped'} else 1)"
          set -a && . ./.env && set +a
          uv run python - <<'PY'
          import json, os
          import boto3
          from botocore.config import Config
          from northstar.infrastructure.postgres import PostgresSettings

          with PostgresSettings.from_env().connect() as c:
              for schema, expected in (("published_af_daily", 1), ("published_af_backfill", 1)):
                  rows = c.execute(
                      f"select a.business_date, a.content_sha256 = r.content_sha256 "
                      f"from {schema}.snapshot_timeline a join published_dev.snapshot_timeline r "
                      f"on r.business_date = a.business_date and r.status = 'PUBLISHED'"
                  ).fetchall()
                  print(schema, rows)
                  assert len(rows) == expected and all(same for _, same in rows), schema
          s3 = boto3.client(
              "s3", endpoint_url=os.environ["NBI_S3_ENDPOINT_URL"],
              aws_access_key_id=os.environ["NBI_S3_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["NBI_S3_SECRET_ACCESS_KEY"],
              region_name="us-east-1", config=Config(s3={"addressing_style": "path"}),
          )
          def keys(prefix):
              pages = s3.get_paginator("list_objects_v2").paginate(
                  Bucket="northstar-data-local", Prefix=prefix)
              return [o["Key"] for p in pages for o in p.get("Contents", [])]
          alerts = keys("audit/alerts/northstar_daily/ci-fails/")
          print("alerts", alerts)
          assert alerts == ["audit/alerts/northstar_daily/ci-fails/ingest-try2.json"], alerts
          lineage = keys("audit/lineage/dbt-core-ci-daily-try")
          print("lineage", lineage)
          events = [json.loads(line) for line in s3.get_object(
              Bucket="northstar-data-local", Key=lineage[0])["Body"].read().decode().splitlines()]
          outputs = {o["name"] for e in events if e["eventType"] == "COMPLETE" for o in e["outputs"]}
          assert "northstar.dbt_dataset.mart_daily_client_cash" in outputs, sorted(outputs)[:5]
          PY
          docker compose --env-file .env --file infrastructure/docker/compose.yaml \
            exec -T airflow-scheduler grep -c '"northstar_daily.publish_controls"' /opt/airflow/lineage/airflow.jsonl

      - name: On failure, show the error lines of the Airflow task logs
        if: failure()
        run: |
          docker compose --env-file .env --file infrastructure/docker/compose.yaml \
            exec -T airflow-scheduler bash -c \
            'grep -rhoE "(ERROR|Error|Traceback|deadlock)[^\"]{0,200}" /opt/airflow/logs/dag_id=northstar_daily | sort | uniq -c | sort -rn | head -40' || true

      - name: Telemetry reached the OpenTelemetry Collector
        # ADR 008/009: the e2e runs export traces, metrics, and logs over OTLP;
        # the Collector's debug exporter prints them.
        run: |
          curl -sf http://127.0.0.1:13133/ > /dev/null
          docker compose --env-file .env --file infrastructure/docker/compose.yaml \
            logs --no-color otel-collector > collector.log
          grep -q "northstar.load_slice" collector.log
          grep -q "northstar.journal_lines.loaded" collector.log
          grep -q "loaded slice:" collector.log
          echo "traces, metrics, and logs received"

      - name: Show service status
        if: always()
        run: make ps

      - name: Show service logs on failure
        if: failure()
        run: docker compose --env-file .env --file infrastructure/docker/compose.yaml logs --no-color --tail 200

      - name: Remove the stack and its volumes
        if: always()
        run: make reset
