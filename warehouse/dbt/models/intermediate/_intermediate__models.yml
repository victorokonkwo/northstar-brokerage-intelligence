version: 2

models:
  - name: int_reporting_dates
    description: >
      Ledger business days (XTSE settlement days) from the first to the last posting
      date. Grain and key = business_date.
    columns:
      - name: business_date
        data_tests: [unique, not_null]

  - name: int_fx_rates_applicable
    description: >
      The USD/CAD rate that applies on each calendar date under fallback policy v1
      (most recent rate on or before the date). Grain and key = calendar_date.
    columns:
      - name: calendar_date
        data_tests: [unique, not_null]
      - name: rate
        data_tests: [not_null]

  - name: int_execution_amounts
    description: >
      Each execution's gross amount, commission, and clearing fee, read from its
      journal lines. Grain and key = execution_id.
    columns:
      - name: execution_id
        data_tests:
          - unique
          - not_null
          - relationships: {arguments: {to: ref('fct_executions'), field: execution_id}}

  - name: int_arrivals
    description: >
      Every raw record the incremental models read, recorded once, with the
      build that first saw it (macros/incremental.sql). Grain and key =
      source_model x record_id. effective_date is the first business date the
      record can change (null = any date); the keys say what it touches.
    config:
      contract: {enforced: true}
    columns:
      - {name: source_model, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: record_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: effective_date, data_type: date}
      - {name: account_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}"}
      - {name: order_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}"}
      - {name: settlement_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}"}
      - {name: instrument_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}"}
      - name: _build_seq
        description: >
          The build that first saw the record. NOT NULL is enforced, so a build
          that was not registered fails here instead of recording a record
          that no model would ever pick up.
        data_type: integer
        constraints: [{type: not_null}]
