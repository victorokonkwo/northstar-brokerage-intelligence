version: 2

models:
  - name: fct_journal_lines
    description: >
      One row per posted journal line (grain). Primary key journal_line_id.
      Amounts are numeric(18, 2) in the line's original currency (ADR 004).
      Exactly one of debit_amount and credit_amount is positive.
    config:
      contract: {enforced: true}
    columns:
      - {name: journal_line_id, data_type: "{{ 'char(36)' if target.type == 'redshift' else 'uuid' }}", constraints: [{type: not_null}], data_tests: [unique, not_null]}
      - {name: journal_batch_id, data_type: "{{ 'char(36)' if target.type == 'redshift' else 'uuid' }}", constraints: [{type: not_null}], data_tests: [not_null]}
      - {name: line_number, data_type: integer, constraints: [{type: not_null}]}
      - {name: gl_account, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: client_account_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}"}
      - {name: debit_amount, data_type: "numeric(18, 2)", constraints: [{type: not_null}]}
      - {name: credit_amount, data_type: "numeric(18, 2)", constraints: [{type: not_null}]}
      - name: currency
        data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}"
        constraints: [{type: not_null}]
        data_tests:
          - accepted_values:
              arguments:
                values: [CAD, USD]
      - {name: business_date, data_type: date, constraints: [{type: not_null}]}
      - {name: posting_date, data_type: date, constraints: [{type: not_null}]}
      - {name: posting_rule_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: posting_rule_version, data_type: integer, constraints: [{type: not_null}]}
      - {name: chart_version, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: ledger_calendar_version, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: source_event_type, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - name: _source_event_id
        data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}"
        constraints: [{type: not_null}]
        description: Lineage to the canonical event that was posted (INV-10).
        data_tests:
          - relationships:
              arguments:
                to: source('brokerage', 'brokerage_events')
                field: event_id
      - {name: _ingestion_run_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: _ingested_at, data_type: timestamp with time zone, constraints: [{type: not_null}]}
      - {name: _dbt_invocation_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}

  - name: fct_executions
    description: One row per execution (fill), the grain. Primary key execution_id.
    config:
      contract: {enforced: true}
    columns:
      - {name: execution_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}], data_tests: [unique, not_null]}
      - name: order_id
        data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}"
        constraints: [{type: not_null}]
        data_tests:
          - relationships: {arguments: {to: ref('fct_orders'), field: order_id}}
      - name: account_id
        data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}"
        constraints: [{type: not_null}]
        data_tests:
          - relationships: {arguments: {to: ref('dim_account'), field: account_id}}
      - name: instrument_id
        data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}"
        constraints: [{type: not_null}]
        data_tests:
          - relationships: {arguments: {to: ref('dim_instrument'), field: instrument_id}}
      - {name: market, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: asset_class, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: side, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: quantity, data_type: "numeric(18, 8)", constraints: [{type: not_null}]}
      - {name: price, data_type: "numeric(18, 8)", constraints: [{type: not_null}]}
      - {name: multiplier, data_type: integer, constraints: [{type: not_null}]}
      - {name: currency, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: commission, data_type: "numeric(18, 2)", constraints: [{type: not_null}]}
      - {name: clearing_fee, data_type: "numeric(18, 2)", constraints: [{type: not_null}], description: Firm expense in the execution currency (5100); 0.00 for trade_executed v1.}
      - {name: executed_at, data_type: timestamp with time zone, constraints: [{type: not_null}]}
      - {name: trade_date, data_type: date, constraints: [{type: not_null}]}
      - {name: settlement_date, data_type: date, constraints: [{type: not_null}]}
      - {name: settlement_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: fee_schedule_version, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: settlement_rules_version, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: calendar_version, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - name: _source_event_id
        data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}"
        constraints: [{type: not_null}]
        data_tests:
          - relationships:
              arguments:
                to: source('brokerage', 'brokerage_events')
                field: event_id
      - {name: _ingestion_run_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: _ingested_at, data_type: timestamp with time zone, constraints: [{type: not_null}]}
      - {name: _schema_version, data_type: integer, constraints: [{type: not_null}]}
      - {name: _dbt_invocation_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}

  - name: dim_account
    description: >
      Account history, SCD Type 2 built from account_created and account_updated
      events (FR-M1-05). One row per account version (grain). Primary key account_sk
      (natural account_id + valid_from). valid_from inclusive, valid_to exclusive
      (null = current).
    config:
      contract: {enforced: true}
    columns:
      - {name: account_sk, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}], data_tests: [unique, not_null]}
      - {name: account_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - name: account_type
        data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}"
        constraints: [{type: not_null}]
        data_tests:
          - accepted_values: {arguments: {values: [CASH, MARGIN]}}
      - {name: base_currency, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - name: status
        data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}"
        constraints: [{type: not_null}]
        data_tests:
          - accepted_values: {arguments: {values: [ACTIVE, TRADING_RESTRICTED]}}
      - {name: change_reason, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: is_margin_eligible, data_type: boolean, constraints: [{type: not_null}]}
      - {name: opened_at, data_type: timestamp with time zone, constraints: [{type: not_null}]}
      - {name: valid_from, data_type: timestamp with time zone, constraints: [{type: not_null}]}
      - {name: valid_to, data_type: timestamp with time zone}
      - {name: is_current, data_type: boolean, constraints: [{type: not_null}]}
      - {name: _source_event_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: _ingestion_run_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: _ingested_at, data_type: timestamp with time zone, constraints: [{type: not_null}]}
      - {name: _schema_version, data_type: integer, constraints: [{type: not_null}]}
      - {name: _dbt_invocation_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}

  - name: dim_instrument
    description: >
      Instruments in SCD Type 2 shape (one version each until an instrument-change
      event exists). One row per instrument version (grain). Primary key instrument_sk.
    config:
      contract: {enforced: true}
    columns:
      - {name: instrument_sk, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}], data_tests: [unique, not_null]}
      - {name: instrument_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}], data_tests: [not_null]}
      - {name: symbol, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: instrument_name, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: market, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - name: asset_class
        data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}"
        constraints: [{type: not_null}]
        data_tests:
          - accepted_values: {arguments: {values: [EQUITY, OPTION]}}
      - name: currency
        data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}"
        constraints: [{type: not_null}]
        data_tests:
          - accepted_values: {arguments: {values: [CAD, USD]}}
      - {name: multiplier, data_type: integer, constraints: [{type: not_null}]}
      - {name: underlying_instrument_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}"}
      - {name: strike, data_type: "numeric(18, 8)"}
      - {name: expiry, data_type: date}
      - {name: option_right, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}"}
      - {name: exercise_style, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}"}
      - {name: valid_from, data_type: timestamp with time zone, constraints: [{type: not_null}]}
      - {name: valid_to, data_type: timestamp with time zone}
      - {name: is_current, data_type: boolean, constraints: [{type: not_null}]}
      - {name: _source_event_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: _ingestion_run_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: _ingested_at, data_type: timestamp with time zone, constraints: [{type: not_null}]}
      - {name: _schema_version, data_type: integer, constraints: [{type: not_null}]}
      - {name: _dbt_invocation_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}

  - name: dim_calendar
    description: >
      One row per market and calendar date (grain). Primary key calendar_day_id
      (market:date). Computed by northstar.domain.calendar and loaded as reference data.
    config:
      contract: {enforced: true}
    columns:
      - {name: calendar_day_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}], data_tests: [unique, not_null]}
      - {name: market, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: calendar_date, data_type: date, constraints: [{type: not_null}]}
      - {name: is_trading_day, data_type: boolean, constraints: [{type: not_null}]}
      - {name: is_settlement_day, data_type: boolean, constraints: [{type: not_null}]}
      - {name: trading_holiday_name, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}"}
      - {name: settlement_holiday_name, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}"}
      - {name: previous_settlement_day, data_type: date}
      - {name: next_settlement_day, data_type: date}
      - {name: calendar_version, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: _ingestion_run_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: _ingested_at, data_type: timestamp with time zone, constraints: [{type: not_null}]}
      - {name: _dbt_invocation_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}

  - name: fct_orders
    description: One row per order (grain). Primary key order_id.
    config:
      contract: {enforced: true}
    columns:
      - {name: order_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}], data_tests: [unique, not_null]}
      - name: account_id
        data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}"
        constraints: [{type: not_null}]
        data_tests:
          - relationships: {arguments: {to: ref('dim_account'), field: account_id}}
      - name: instrument_id
        data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}"
        constraints: [{type: not_null}]
        data_tests:
          - relationships: {arguments: {to: ref('dim_instrument'), field: instrument_id}}
      - {name: market, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: side, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: order_type, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: quantity, data_type: "numeric(18, 8)", constraints: [{type: not_null}]}
      - {name: limit_price, data_type: "numeric(18, 8)"}
      - name: currency
        data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}"
        constraints: [{type: not_null}]
        data_tests:
          - accepted_values: {arguments: {values: [CAD, USD]}}
      - {name: placed_at, data_type: timestamp with time zone, constraints: [{type: not_null}]}
      - {name: filled_quantity, data_type: "numeric(18, 8)", constraints: [{type: not_null}]}
      - {name: cancelled_quantity, data_type: "numeric(18, 8)", constraints: [{type: not_null}]}
      - {name: execution_count, data_type: integer, constraints: [{type: not_null}]}
      - {name: cancelled_at, data_type: timestamp with time zone}
      - name: order_status
        data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}"
        constraints: [{type: not_null}]
        data_tests:
          - accepted_values: {arguments: {values: [OPEN, PARTIALLY_FILLED, FILLED, CANCELLED]}}
      - {name: _source_event_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: _ingestion_run_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: _ingested_at, data_type: timestamp with time zone, constraints: [{type: not_null}]}
      - {name: _schema_version, data_type: integer, constraints: [{type: not_null}]}
      - {name: _dbt_invocation_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}

  - name: fct_settlements
    description: >
      One row per settlement obligation (grain): an order's executions on one trade
      date (INV-06), or an option exercise (roadmap 5C-b; no order, no executions).
      Primary key settlement_id. settled_* columns and lineage are null while
      PENDING; the amount is posted by Python and never recomputed here.
    config:
      contract: {enforced: true}
    columns:
      - {name: settlement_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}], data_tests: [unique, not_null]}
      - name: order_id
        description: The order, for an EXECUTION obligation; null for an EXERCISE.
        data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}"
        data_tests:
          - relationships: {arguments: {to: ref('fct_orders'), field: order_id}}
      - {name: account_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: instrument_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: market, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: side, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - name: currency
        data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}"
        constraints: [{type: not_null}]
        data_tests:
          - accepted_values: {arguments: {values: [CAD, USD]}}
      - {name: trade_date, data_type: date, constraints: [{type: not_null}]}
      - {name: contractual_settlement_date, data_type: date, constraints: [{type: not_null}]}
      - {name: executed_quantity, data_type: "numeric(18, 8)", constraints: [{type: not_null}]}
      - {name: execution_count, data_type: integer, constraints: [{type: not_null}]}
      - {name: settled_quantity, data_type: "numeric(18, 8)"}
      - {name: settled_amount, data_type: "numeric(18, 2)"}
      - {name: settled_at, data_type: timestamp with time zone}
      - name: settlement_status
        data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}"
        constraints: [{type: not_null}]
        data_tests:
          - accepted_values: {arguments: {values: [PENDING, SETTLED]}}
      - name: obligation_type
        data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}"
        constraints: [{type: not_null}]
        data_tests:
          - accepted_values: {arguments: {values: [EXECUTION, EXERCISE]}}
      - {name: _source_event_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}"}
      - {name: _ingestion_run_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}"}
      - {name: _ingested_at, data_type: timestamp with time zone}
      - {name: _schema_version, data_type: integer}
      - {name: _dbt_invocation_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}

  - name: fct_cash_movements
    description: >
      One row per client deposit, withdrawal, or FX conversion (grain). Primary key
      cash_movement_id (the fx_conversion_id for conversions). Money in and money out
      each carry their own currency.
    config:
      contract: {enforced: true}
    columns:
      - {name: cash_movement_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}], data_tests: [unique, not_null]}
      - name: account_id
        data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}"
        constraints: [{type: not_null}]
        data_tests:
          - relationships: {arguments: {to: ref('dim_account'), field: account_id}}
      - name: movement_type
        data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}"
        constraints: [{type: not_null}]
        data_tests:
          - accepted_values: {arguments: {values: [DEPOSIT, WITHDRAWAL, FX_CONVERSION]}}
      - {name: event_timestamp, data_type: timestamp with time zone, constraints: [{type: not_null}]}
      - {name: business_date, data_type: date, constraints: [{type: not_null}]}
      - {name: amount_in, data_type: "numeric(18, 2)"}
      - {name: currency_in, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}"}
      - {name: amount_out, data_type: "numeric(18, 2)"}
      - {name: currency_out, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}"}
      - {name: reference_rate, data_type: "numeric(18, 10)"}
      - {name: client_rate, data_type: "numeric(18, 10)"}
      - {name: rate_date, data_type: date}
      - {name: fx_policy_version, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}"}
      - {name: _source_event_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: _ingestion_run_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: _ingested_at, data_type: timestamp with time zone, constraints: [{type: not_null}]}
      - {name: _schema_version, data_type: integer, constraints: [{type: not_null}]}
      - {name: _dbt_invocation_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}

  - name: fct_fx_rates_daily
    description: >
      One row per published reference rate (grain: base_currency x quote_currency x
      rate_date; unique, tested in assert_daily_fact_grains_unique). Synthetic
      USD/CAD path, quote currency per 1 unit of base.
    config:
      contract: {enforced: true}
    columns:
      - name: base_currency
        data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}"
        constraints: [{type: not_null}]
        data_tests:
          - accepted_values: {arguments: {values: [CAD, USD]}}
      - name: quote_currency
        data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}"
        constraints: [{type: not_null}]
        data_tests:
          - accepted_values: {arguments: {values: [CAD, USD]}}
      - {name: rate_date, data_type: date, constraints: [{type: not_null}]}
      - {name: rate, data_type: "numeric(18, 10)", constraints: [{type: not_null}]}
      - {name: rate_source, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: fx_policy_version, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: published_at, data_type: timestamp with time zone, constraints: [{type: not_null}]}
      - {name: _source_event_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: _ingestion_run_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: _ingested_at, data_type: timestamp with time zone, constraints: [{type: not_null}]}
      - {name: _schema_version, data_type: integer, constraints: [{type: not_null}]}
      - {name: _dbt_invocation_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}

  - name: fct_market_prices_daily
    description: >
      One row per instrument x reporting date with a close on or before it (grain;
      unique, tested in assert_daily_fact_grains_unique). is_stale is true when the
      instrument's market traded after price_date, on or before business_date, or
      when the calendar can't say (INV-08).
    config:
      contract: {enforced: true}
    columns:
      - {name: instrument_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: business_date, data_type: date, constraints: [{type: not_null}]}
      - {name: price_date, data_type: date, constraints: [{type: not_null}]}
      - {name: close_price, data_type: "numeric(18, 8)", constraints: [{type: not_null}]}
      - name: currency
        data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}"
        constraints: [{type: not_null}]
        data_tests:
          - accepted_values: {arguments: {values: [CAD, USD]}}
      - {name: price_source, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: expected_price_date, data_type: date}
      - {name: is_stale, data_type: boolean, constraints: [{type: not_null}]}
      - {name: _source_event_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: _ingestion_run_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: _ingested_at, data_type: timestamp with time zone, constraints: [{type: not_null}]}
      - {name: _schema_version, data_type: integer, constraints: [{type: not_null}]}
      - {name: _dbt_invocation_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}

  - name: fct_positions_daily
    description: >
      One row per account x instrument x reporting date with a non-zero trade-date
      or settled quantity (grain; unique, tested in assert_daily_fact_grains_unique).
      Market values are rounded half-even once (ADR 004), and are null when the
      price is missing (INV-08). USD values carry the FX rate used (INV-07).
    config:
      contract: {enforced: true}
    columns:
      - name: account_id
        data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}"
        constraints: [{type: not_null}]
        data_tests:
          - relationships: {arguments: {to: ref('dim_account'), field: account_id}}
      - name: instrument_id
        data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}"
        constraints: [{type: not_null}]
        data_tests:
          - relationships: {arguments: {to: ref('dim_instrument'), field: instrument_id}}
      - {name: business_date, data_type: date, constraints: [{type: not_null}]}
      - {name: trade_date_quantity, data_type: "numeric(18, 8)", constraints: [{type: not_null}]}
      - {name: settled_quantity, data_type: "numeric(18, 8)", constraints: [{type: not_null}]}
      - name: currency
        data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}"
        constraints: [{type: not_null}]
        data_tests:
          - accepted_values: {arguments: {values: [CAD, USD]}}
      - {name: close_price, data_type: "numeric(18, 8)"}
      - {name: price_date, data_type: date}
      - {name: is_price_missing, data_type: boolean, constraints: [{type: not_null}]}
      - {name: is_price_stale, data_type: boolean, constraints: [{type: not_null}]}
      - {name: market_value, data_type: "numeric(18, 2)"}
      - {name: market_value_cad, data_type: "numeric(18, 2)"}
      - {name: fx_rate, data_type: "numeric(18, 10)"}
      - {name: fx_rate_date, data_type: date}
      - {name: fx_policy_version, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}"}
      - {name: _price_event_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", description: Lineage to the close used (INV-10).}
      - {name: _dbt_invocation_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}

  - name: fct_reconciliation_exceptions
    description: >
      One row per reconciliation exception (grain) with its current lifecycle state.
      Primary key exception_id. Impact and severity are Python's (ADR 007); status,
      resolution, and escalation come from the append-only transition trail.
    config:
      contract: {enforced: true}
    columns:
      - {name: exception_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}], data_tests: [unique, not_null]}
      - {name: reconciliation, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: exception_type, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: severity, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: reference, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: business_date, data_type: date, constraints: [{type: not_null}]}
      - {name: impact_amount, data_type: "numeric(18, 8)", constraints: [{type: not_null}]}
      - {name: impact_currency, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: impact_basis, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: impact_cad, data_type: "numeric(18, 2)"}
      - {name: fx_rate_date, data_type: date}
      - {name: fx_policy_version, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}"}
      - {name: external_record_ids, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - name: status
        data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}"
        constraints: [{type: not_null}]
        data_tests:
          - accepted_values: {arguments: {values: [OPEN, INVESTIGATING, ESCALATED, RESOLVED]}}
      - {name: resolution_type, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}"}
      - {name: last_actor, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: opened_at, data_type: timestamp with time zone, constraints: [{type: not_null}]}
      - {name: resolved_at, data_type: timestamp with time zone}
      - {name: was_escalated, data_type: boolean, constraints: [{type: not_null}]}
      - {name: transition_count, data_type: integer, constraints: [{type: not_null}]}
      - {name: policy_version, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: _detected_run_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: _dbt_invocation_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}

  - name: fct_price_history_daily
    description: >
      One row per instrument and day with a close (grain; unique, tested in
      assert_daily_fact_grains_unique): the synthetic history before the dataset
      window, then the window's closes. Read by historical VaR and the backtest
      (roadmap 5A). No close is carried forward.
    config:
      contract: {enforced: true}
    columns:
      - {name: instrument_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}], data_tests: [not_null]}
      - {name: price_date, data_type: date, constraints: [{type: not_null}], data_tests: [not_null]}
      - {name: close_price, data_type: "numeric(18, 8)", constraints: [{type: not_null}], data_tests: [not_null]}
      - name: currency
        data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}"
        constraints: [{type: not_null}]
        data_tests:
          - accepted_values: {arguments: {values: [CAD, USD]}}
      - {name: price_source, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: _source_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: _dbt_invocation_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}

  - name: fct_fx_rate_history_daily
    description: >
      One row per USD/CAD reference rate date (grain; unique, tested in
      assert_daily_fact_grains_unique): the synthetic history before the dataset
      window, then the window's published rates. CAD per 1 USD (roadmap 5A).
    config:
      contract: {enforced: true}
    columns:
      - {name: base_currency, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: quote_currency, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: rate_date, data_type: date, constraints: [{type: not_null}], data_tests: [not_null]}
      - {name: rate, data_type: "numeric(18, 10)", constraints: [{type: not_null}], data_tests: [not_null]}
      - {name: rate_source, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: _source_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: _dbt_invocation_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}

  - name: fct_dividend_payments
    description: >
      One row per dividend x entitled account (grain; primary key dividend_id +
      account_id, unique, tested in assert_daily_fact_grains_unique): the client cash credited on the pay date, from the ledger's
      dividend_paid batches (roadmap 5C-a, ADR 013). Entitlement is the settled
      holding at the end of the record date.
    config:
      contract: {enforced: true}
    columns:
      - {name: dividend_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}], data_tests: [not_null]}
      - {name: account_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}], data_tests: [not_null]}
      - {name: instrument_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: record_date, data_type: date, constraints: [{type: not_null}]}
      - {name: pay_date, data_type: date, constraints: [{type: not_null}]}
      - {name: posting_date, data_type: date, constraints: [{type: not_null}]}
      - name: currency
        data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}"
        constraints: [{type: not_null}]
        data_tests:
          - accepted_values: {arguments: {values: [CAD, USD]}}
      - {name: amount_per_share, data_type: "numeric(18, 8)", constraints: [{type: not_null}]}
      - {name: amount, data_type: "numeric(18, 2)", constraints: [{type: not_null}], data_tests: [not_null]}
      - {name: _source_event_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: _dbt_invocation_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
