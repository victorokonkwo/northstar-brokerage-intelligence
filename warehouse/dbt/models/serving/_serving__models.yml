version: 2
models:
- name: serving_exception_monitoring
  description: 'KPI-03 and KPI-04 as currently published: the rows of mart_exception_monitoring in each
    business date''s PUBLISHED controls snapshot, with snapshot_version and published_at. Same grain as
    mart_exception_monitoring. Read by the operations dashboard.'
  config:
    contract:
      enforced: true
  columns:
  - name: business_date
    data_type: date
    data_tests:
    - not_null
  - name: reconciliation
    data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}"
  - name: exception_type
    data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}"
  - name: severity
    data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}"
  - name: exception_count
    data_type: integer
  - name: open_count
    data_type: integer
  - name: past_sla_open_count
    data_type: integer
  - name: resolved_count
    data_type: integer
  - name: open_exposure_cad
    data_type: "numeric(18, 2)"
  - name: policy_version
    data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}"
  - name: reconciled_as_of
    data_type: date
  - name: snapshot_version
    data_type: integer
    data_tests:
    - not_null
    description: The published snapshot version these rows come from.
  - name: published_at
    data_type: timestamp with time zone
    data_tests:
    - not_null
    description: When that version was published (UTC).
