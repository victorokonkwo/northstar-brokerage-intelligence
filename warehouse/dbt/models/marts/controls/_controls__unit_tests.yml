version: 2

unit_tests:
  - name: count_ratios_round_half_even_exactly
    model: mart_match_rates
    description: >
      Count ratios are computed in integer arithmetic (count_ratio_half_even), so
      no warehouse's decimal scale rules can change them. On 2026-03-02, 1 of 128
      executions matched: 0.0078125 is a tie and rounds to the even 0.007812, where
      half-up would give 0.007813. On 2026-03-03, 17 of 18 matched: 0.944444, which
      Redshift's numeric(38, 0) division would have cut to 0.9444.
    given:
      - input: ref('int_execution_amounts')
        format: sql
        rows: |
          -- Number rows by UNION ALL: Redshift has no multi-row VALUES in FROM.
          select
              'exe_' || cast(a.n as varchar) || '_' || cast(b.n as varchar) as execution_id,
              cast('2026-03-02' as date) as trade_date,
              'CAD' as currency,
              cast(100.00 as numeric(18, 2)) as gross_amount
          from (select 1 as n union all select 2 union all select 3 union all select 4 union all select 5 union all select 6 union all select 7 union all select 8) as a
          cross join (select 1 as n union all select 2 union all select 3 union all select 4 union all select 5 union all select 6 union all select 7 union all select 8 union all select 9 union all select 10 union all select 11 union all select 12 union all select 13 union all select 14 union all select 15 union all select 16) as b
          union all
          select
              'exe_d2_' || cast(a.n as varchar) || '_' || cast(b.n as varchar),
              cast('2026-03-03' as date),
              'CAD',
              cast(100.00 as numeric(18, 2))
          from (select 1 as n union all select 2 union all select 3) as a
          cross join (select 1 as n union all select 2 union all select 3 union all select 4 union all select 5 union all select 6) as b
      - input: ref('stg_recon__match_results')
        format: sql
        rows: |
          select 'exe_1_1' as internal_ref, 'executions' as reconciliation
          union all
          select 'exe_d2_' || cast(a.n as varchar) || '_' || cast(b.n as varchar), 'executions'
          from (select 1 as n union all select 2 union all select 3) as a
          cross join (select 1 as n union all select 2 union all select 3 union all select 4 union all select 5 union all select 6) as b
          where not (a.n = 3 and b.n = 6)
    expect:
      rows:
        - {business_date: 2026-03-02, currency: CAD, execution_count: 128, matched_count: 1, match_rate: 0.007812}
        - {business_date: 2026-03-03, currency: CAD, execution_count: 18, matched_count: 17, match_rate: 0.944444}
