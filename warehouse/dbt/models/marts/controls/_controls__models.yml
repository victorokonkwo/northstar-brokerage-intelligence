version: 2

models:
  - name: mart_ledger_balance_controls
    description: >
      Ledger balance controls. Grain: one row per business_date x currency.
      unbalanced_batch_count is KPI-01 (target exactly 0; any other value
      blocks publication). Aggregates are unconstrained numeric, as ADR 004
      allows for sums. Snapshot versions arrive with ADR 006 in Phase 3.
    config:
      materialized: table
      contract: {enforced: true}
    columns:
      - {name: business_date, data_type: date, constraints: [{type: not_null}]}
      - {name: currency, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: batch_count, data_type: bigint, constraints: [{type: not_null}]}
      - {name: line_count, data_type: bigint, constraints: [{type: not_null}]}
      - {name: total_debit, data_type: "numeric(38, 2)", constraints: [{type: not_null}]}
      - {name: total_credit, data_type: "numeric(38, 2)", constraints: [{type: not_null}]}
      - {name: unbalanced_batch_count, data_type: bigint, constraints: [{type: not_null}]}
      - {name: _dbt_invocation_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}

  - name: mart_exception_monitoring
    description: >
      KPI-03 and KPI-04 per business date x reconciliation x exception type x severity
      (grain; unique, tested in assert_controls_grains_unique). Current lifecycle state
      as of the latest reconciliation run (reconciled_as_of).
    config:
      tags: [controls]
      contract: {enforced: true}
    columns:
      - {name: business_date, data_type: date, constraints: [{type: not_null}]}
      - {name: reconciliation, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: exception_type, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: severity, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: exception_count, data_type: integer, constraints: [{type: not_null}]}
      - {name: open_count, data_type: integer, constraints: [{type: not_null}]}
      - {name: past_sla_open_count, data_type: integer, constraints: [{type: not_null}]}
      - {name: resolved_count, data_type: integer, constraints: [{type: not_null}]}
      - {name: open_exposure_cad, data_type: "numeric(18, 2)", constraints: [{type: not_null}]}
      - {name: policy_version, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: reconciled_as_of, data_type: date, constraints: [{type: not_null}]}
      - {name: _dbt_invocation_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}

  - name: mart_match_rates
    description: >
      KPI-02 per trade date x currency (grain; unique, tested in
      assert_controls_grains_unique): executions matched to a clearing confirmation,
      by count and gross notional.
    config:
      tags: [controls]
      contract: {enforced: true}
    columns:
      - {name: business_date, data_type: date, constraints: [{type: not_null}]}
      - name: currency
        data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}"
        constraints: [{type: not_null}]
        data_tests:
          - accepted_values: {arguments: {values: [CAD, USD]}}
      - {name: execution_count, data_type: integer, constraints: [{type: not_null}]}
      - {name: matched_count, data_type: integer, constraints: [{type: not_null}]}
      - {name: match_rate, data_type: "numeric(18, 6)", constraints: [{type: not_null}]}
      - {name: notional, data_type: "numeric(18, 2)", constraints: [{type: not_null}]}
      - {name: matched_notional, data_type: "numeric(18, 2)", constraints: [{type: not_null}]}
      - {name: notional_match_rate, data_type: "numeric(18, 6)"}
      - {name: _dbt_invocation_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}

  - name: mart_settlement_fails
    description: >
      KPI-05 per contractual settlement date x currency x asset class (grain; unique,
      tested in assert_controls_grains_unique): obligations the depository reported
      late or did not confirm.
    config:
      tags: [controls]
      contract: {enforced: true}
    columns:
      - {name: business_date, data_type: date, constraints: [{type: not_null}]}
      - name: currency
        data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}"
        constraints: [{type: not_null}]
        data_tests:
          - accepted_values: {arguments: {values: [CAD, USD]}}
      - {name: asset_class, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
      - {name: obligations_due, data_type: integer, constraints: [{type: not_null}]}
      - {name: failed_count, data_type: integer, constraints: [{type: not_null}]}
      - {name: fail_rate, data_type: "numeric(18, 6)", constraints: [{type: not_null}]}
      - {name: value_due, data_type: "numeric(18, 2)", constraints: [{type: not_null}]}
      - {name: value_failed, data_type: "numeric(18, 2)", constraints: [{type: not_null}]}
      - {name: value_fail_rate, data_type: "numeric(18, 6)"}
      - {name: _dbt_invocation_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}

  - name: mart_cash_breaks
    description: >
      KPI-06 per reporting date x currency (grain; unique, tested in
      assert_controls_grains_unique): GL 1000 against the bank statement, rolled
      forward, with late settlements in transit as explained timing differences.
    config:
      tags: [controls]
      contract: {enforced: true}
    columns:
      - {name: business_date, data_type: date, constraints: [{type: not_null}]}
      - name: currency
        data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}"
        constraints: [{type: not_null}]
        data_tests:
          - accepted_values: {arguments: {values: [CAD, USD]}}
      - {name: gl_cash_balance, data_type: "numeric(18, 2)", constraints: [{type: not_null}]}
      - {name: bank_balance, data_type: "numeric(18, 2)", constraints: [{type: not_null}]}
      - {name: difference, data_type: "numeric(18, 2)", constraints: [{type: not_null}]}
      - {name: explained_timing, data_type: "numeric(18, 2)", constraints: [{type: not_null}]}
      - {name: unexplained, data_type: "numeric(18, 2)", constraints: [{type: not_null}]}
      - {name: cash_break_amount, data_type: "numeric(18, 2)", constraints: [{type: not_null}]}
      - {name: _dbt_invocation_id, data_type: "{{ 'varchar(4096)' if target.type == 'redshift' else 'text' }}", constraints: [{type: not_null}]}
