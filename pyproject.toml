[project]
name = "northstar"
version = "0.1.0"
description = "Finance and market-risk analytics for a simulated Canadian online brokerage (synthetic data only)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "boto3>=1.44.7",
    "numpy>=2.5.5",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
]

[project.scripts]
northstar = "northstar.application.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dbt = [
    "dbt-core>=1.12.7,<1.13",
    "dbt-postgres>=1.11.0,<1.12",
    "dbt-redshift>=1.11.2,<1.12",
    "openlineage-dbt>=1.55.0,<2",
    "sqlfluff>=4.5.0",
    "sqlfluff-templater-dbt>=4.5.0",
]
dev = [
    "hypothesis>=6.170.15",
    "import-linter>=2.17",
    "mypy>=2.4.1",
    "mypy-boto3-s3>=1.44.6",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "types-pyyaml>=6.0.12.20261113",
]

[tool.uv]
default-groups = ["dev", "dbt"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "D",        # pydocstyle
    "UP",       # pyupgrade
    "B",        # bugbear
    "S",        # bandit (security)
    "DTZ",      # naive datetimes (CONTRIBUTING.md W3)
    "T20",      # print statements
    "C4", "PIE", "SIM", "RET", "PTH", "PERF", "TRY", "ERA", "PT", "RUF",
]

[tool.ruff.lint.isort]
known-local-folder = ["factories", "incremental_scenario"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "D",     # test names describe the case
    "S101",  # assert is how pytest checks
]

[tool.mypy]
strict = true
python_version = "3.13"
files = ["src", "tests", "scripts"]
mypy_path = "tests"
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "-ra",
    "-m",
    "not integration and not redshift",  # selected by `make test-integration` / `make test-redshift`
]
markers = [
    "integration: needs the local stack (`make up`) and the NBI_PG_* variables",
    "redshift: needs the applied Terraform data stack and `aws login` (`make test-redshift`; costs compute)",
]
xfail_strict = true
filterwarnings = ["error"]

[tool.importlinter]
root_package = "northstar"
include_external_packages = true

[[tool.importlinter.contracts]]
# Dependency direction from system overview §3: application at the top, the
# domain depends only on common, and common depends on nothing. Packages that
# don't exist yet are optional (in parentheses). The middle layer's members
# may import each other; their mutual rules are not decided yet. "exhaustive"
# fails the check when a new northstar subpackage is not placed in a layer.
name = "Layered architecture (system overview §3)"
type = "layers"
containers = ["northstar"]
exhaustive = true
layers = [
    "(application)",
    "(infrastructure) : (ingestion) : (simulation)",
    "(domain)",
    "common",
]

[[tool.importlinter.contracts]]
# The domain is pure business logic: no database, telemetry, or file-format
# libraries (CONTRIBUTING.md W5). It may use pydantic for validated models.
name = "Domain does no I/O (CONTRIBUTING.md W5)"
type = "forbidden"
source_modules = ["northstar.domain", "northstar.common"]
forbidden_modules = ["psycopg", "opentelemetry", "yaml"]
