# Dev dataset for the seeded generator (owner decision 2026-11-19: about 50
# accounts, Q1 2026). ILLUSTRATIVE: every instrument, price path, FX path, and
# activity parameter is invented. Symbols are synthetic, not real securities.
# The September options expire after the window; four short-dated ones expire
# inside it (roadmap 5C-b; see below).
# Option closes are model prices (roadmap 5B, ADR 012): the binomial tree on the
# underlying's close, at the option's annual implied_vol and its currency's rate
# (config/risk/rates.yaml). Each implied_vol is its underlying's daily_vol x
# sqrt(252), rounded (SYNB 0.017 -> 0.27, SYNF 0.014 -> 0.22), so the options are
# priced consistently with how their underlying moves.
dataset_id: dev
illustrative: true
window: {start: 2026-01-02, end: 2026-03-31}
# Synthetic market history before the window, for historical VaR (roadmap 5A,
# owner decisions 2026-11-20): every weekday (a synthetic calendar, not real 2025
# exchange days), equity closes and USD/CAD rates walked backward from each
# start_price and from fx.start_rate. External record sets price_history and
# fx_rate_history; the window's own paths are unchanged.
history: {start: 2025-01-02, end: 2025-12-31}
settlement_time_local: "12:00:00"

accounts: {count: 50, margin_share: "0.40", base_currency: CAD}

# Gap between consecutive actions in the day's shared clock (5-90 seconds).
clock_step: {unit: seconds, min: 5, max: 90}

# Account changes after opening (FR-M1-05 SCD2 history): margin approvals of
# CASH accounts, and short trading restrictions.
lifecycle:
  margin_approval_probability: "0.25"
  restriction_probability: "0.06"
  restriction_business_days: 5

# Synthetic USD/CAD reference rate (CAD per USD), not Bank of Canada data.
fx: {start_rate: "1.3700", daily_vol: "0.0040"}

instruments:
  - {key: SYNA, symbol: SYNA, name: Synthetic Alpha Corp., market: XTSE, asset_class: EQUITY, currency: CAD, start_price: "52.40", daily_vol: "0.018"}
  - {key: SYNC, symbol: SYNC, name: Synthetic Gamma Ltd., market: XTSE, asset_class: EQUITY, currency: CAD, start_price: "18.75", daily_vol: "0.022"}
  - {key: SYND, symbol: SYND, name: Synthetic Delta Inc., market: XTSE, asset_class: EQUITY, currency: CAD, start_price: "104.10", daily_vol: "0.012"}
  - {key: SYNE, symbol: SYNE, name: Synthetic Epsilon Corp., market: XTSE, asset_class: EQUITY, currency: CAD, start_price: "7.35", daily_vol: "0.030"}
  - {key: SYNB, symbol: SYNB, name: Synthetic Beta Inc., market: XNYS, asset_class: EQUITY, currency: USD, start_price: "61.20", daily_vol: "0.017"}
  - {key: SYNF, symbol: SYNF, name: Synthetic Zeta Corp., market: XNYS, asset_class: EQUITY, currency: USD, start_price: "143.80", daily_vol: "0.014"}
  - {key: SYNG, symbol: SYNG, name: Synthetic Eta Inc., market: XNYS, asset_class: EQUITY, currency: USD, start_price: "22.45", daily_vol: "0.026"}
  - {key: SYNH, symbol: SYNH, name: Synthetic Theta Ltd., market: XNYS, asset_class: EQUITY, currency: USD, start_price: "9.80", daily_vol: "0.035"}
  - key: SYNB-C
    symbol: SYNB-C-20260918-65
    name: Synthetic Beta Inc. call, 65.00, 2026-09-18
    market: XCBO
    asset_class: OPTION
    currency: USD
    multiplier: 100
    option: {underlying: SYNB, strike: "65.00", expiry: 2026-09-18, right: CALL, exercise_style: AMERICAN}
    implied_vol: "0.27"
  - key: SYNF-P
    symbol: SYNF-P-20260918-135
    name: Synthetic Zeta Corp. put, 135.00, 2026-09-18
    market: XCBO
    asset_class: OPTION
    currency: USD
    multiplier: 100
    option: {underlying: SYNF, strike: "135.00", expiry: 2026-09-18, right: PUT, exercise_style: AMERICAN}
    implied_vol: "0.22"

  # Short-dated options expiring inside the window (roadmap 5C-b, ADR 013), on
  # third Fridays (OCC By-Laws). The SYNG pair shares a strike and expiry, so one
  # finishes in the money and the other expires. The deep in-the-money SYNB call
  # and the deep in-the-money SYNH 7.00 call (affordable at about $250 a contract)
  # are worth exercising early the day before their underlying goes ex-dividend.
  # Implied vols are the underlyings' daily_vol x sqrt(252), rounded.
  - key: SYNB-C45
    symbol: SYNB-C-20260320-45
    name: Synthetic Beta Inc. call, 45.00, 2026-03-20
    market: XCBO
    asset_class: OPTION
    currency: USD
    multiplier: 100
    option: {underlying: SYNB, strike: "45.00", expiry: 2026-03-20, right: CALL, exercise_style: AMERICAN}
    implied_vol: "0.27"
  - key: SYNG-C
    symbol: SYNG-C-20260320-22.5
    name: Synthetic Eta Inc. call, 22.50, 2026-03-20
    market: XCBO
    asset_class: OPTION
    currency: USD
    multiplier: 100
    option: {underlying: SYNG, strike: "22.50", expiry: 2026-03-20, right: CALL, exercise_style: AMERICAN}
    implied_vol: "0.41"
  - key: SYNG-P
    symbol: SYNG-P-20260320-22.5
    name: Synthetic Eta Inc. put, 22.50, 2026-03-20
    market: XCBO
    asset_class: OPTION
    currency: USD
    multiplier: 100
    option: {underlying: SYNG, strike: "22.50", expiry: 2026-03-20, right: PUT, exercise_style: AMERICAN}
    implied_vol: "0.41"
  - key: SYNH-C7
    symbol: SYNH-C-20260320-7
    name: Synthetic Theta Ltd. call, 7.00, 2026-03-20
    market: XCBO
    asset_class: OPTION
    currency: USD
    multiplier: 100
    option: {underlying: SYNH, strike: "7.00", expiry: 2026-03-20, right: CALL, exercise_style: AMERICAN}
    implied_vol: "0.56"
  - key: SYNH-C
    symbol: SYNH-C-20260220-10
    name: Synthetic Theta Ltd. call, 10.00, 2026-02-20
    market: XCBO
    asset_class: OPTION
    currency: USD
    multiplier: 100
    option: {underlying: SYNH, strike: "10.00", expiry: 2026-02-20, right: CALL, exercise_style: AMERICAN}
    implied_vol: "0.56"

# Early exercise (roadmap 5C-b; illustrative): when the model says exercising beats
# holding, each holder who can exercise does so with this probability.
option_exercise: {early_exercise_probability: "0.8"}

# Cash dividends (roadmap 5C-a, ADR 013). ILLUSTRATIVE: invented rates and dates,
# whole cents per share. Each record_date is also the ex-dividend date (T+1) and a
# business day on the instrument's market; the price drops by the dividend that
# day, and the options on SYNB and SYNF are priced with them once declared.
dividends:
  - {instrument: SYNA, amount_per_share: "0.26", declaration_date: 2026-01-20, record_date: 2026-02-13, pay_date: 2026-02-27}
  - {instrument: SYNB, amount_per_share: "0.40", declaration_date: 2026-01-27, record_date: 2026-02-26, pay_date: 2026-03-12}
  - {instrument: SYND, amount_per_share: "0.95", declaration_date: 2026-02-02, record_date: 2026-03-06, pay_date: 2026-03-20}
  - {instrument: SYNF, amount_per_share: "0.85", declaration_date: 2026-02-10, record_date: 2026-03-12, pay_date: 2026-03-26}
  - {instrument: SYNH, amount_per_share: "0.25", declaration_date: 2026-02-10, record_date: 2026-03-05, pay_date: 2026-03-19}

# FR-SIM-05: seasonal deposits (higher in January and February), month-end
# withdrawals, and order intensity that rises with the day's price moves.
deposits:
  daily_probability: "0.03"
  seasonal: {1: "1.6", 2: "1.4", 3: "1.0"}
  mean_amount: "2500"
  initial_mean_amount: "8000"
  min_amount: "100"
withdrawals:
  daily_probability: "0.006"
  month_end_multiplier: "5"
  month_end_days: 2
  max_fraction: "0.50"
orders:
  daily_rate: "0.15"
  volatility_sensitivity: "1.5"
  sell_probability: "0.35"
  option_probability: "0.08"
  budget_min: "0.05"
  budget_max: "0.30"
  margin_headroom_use: "0.60"
  usd_conversion_fraction: "0.50"
  max_partial_fills: 3
  cancel_probability: "0.10"
  price_noise: "0.002"
